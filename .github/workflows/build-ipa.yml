name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version
      - name: Archive (no signing)
        run: |
          xcodebuild -project ACR.xcodeproj \
            -scheme ACR \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ACR.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive
      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/ACR.xcarchive/Products/Applications/ACR.app build/Payload/
          cd build && zip -r ACR-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ACR-unsigned
          path: build/ACR-unsigned.ipa
          retention-days: 30
